<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FreshMart – Online Grocery Delivery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --g900: #0D2B22; --g700: #1A4731; --g600: #1E5C3A;
  --g500: #276749; --g400: #38A169; --g300: #68D391;
  --g100: #C6F6D5; --g50: #F0FFF4;
  --amber: #D97706; --orange: #EA580C;
  --text: #1A202C; --text2: #4A5568; --text3: #718096;
  --border: #E2E8F0; --bg: #F7FAFA; --white: #FFFFFF;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 16px rgba(0,0,0,.10);
  --shadow-lg: 0 12px 48px rgba(0,0,0,.18);
  --r: 12px; --font: 'Inter', -apple-system, sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.5; }

/* Promo */
.promo-bar {
  background: var(--g900); color: rgba(255,255,255,.85);
  font-size: 12.5px; padding: 8px 20px;
  display: flex; align-items: center; justify-content: center; gap: 32px; flex-wrap: wrap;
}
.promo-bar .hi { color: #68D391; font-weight: 600; }

/* Header */
.header { background: var(--white); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
.header-inner { max-width: 1280px; margin: 0 auto; padding: 12px 24px; display: flex; align-items: center; gap: 20px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }
.logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--g600), var(--g400)); border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 22px; box-shadow: 0 2px 8px rgba(38,103,73,.35); }
.logo-name { font-size: 21px; font-weight: 800; color: var(--g700); letter-spacing: -.3px; }
.logo-name span { color: var(--g400); }
.search-wrap { flex: 1; max-width: 500px; margin: 0 auto; position: relative; }
.search-wrap input { width: 100%; padding: 10px 16px 10px 44px; border: 1.5px solid var(--border); border-radius: 50px; font-size: 14px; font-family: var(--font); background: var(--bg); outline: none; transition: border-color .2s, background .2s; }
.search-wrap input:focus { border-color: var(--g400); background: var(--white); }
.search-icon { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-size: 17px; pointer-events: none; }
.hdr-actions { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.cust-chip { display: flex; align-items: center; gap: 8px; background: var(--g50); border: 1.5px solid var(--g100); border-radius: 50px; padding: 6px 14px 6px 8px; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--g700); transition: background .15s; user-select: none; }
.cust-chip:hover { background: var(--g100); }
.cust-avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--g700); color: white; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.tier-badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 50px; margin-left: 2px; }
.t-gold   { background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; }
.t-silver { background: #F1F5F9; color: #475569; border: 1px solid #CBD5E1; }
.t-bronze { background: #FEF9EE; color: #9A3412; border: 1px solid #FED7AA; }
.cart-btn { display: flex; align-items: center; gap: 8px; background: var(--g700); color: white; border: none; border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font); transition: background .2s; position: relative; }
.cart-btn:hover { background: var(--g900); }
.cart-count { position: absolute; top: -6px; right: -6px; width: 20px; height: 20px; border-radius: 50%; background: var(--orange); color: white; font-size: 11px; font-weight: 700; display: none; align-items: center; justify-content: center; border: 2px solid white; }
.cart-count.on { display: flex; }

/* Category nav */
.cat-nav { background: var(--white); border-bottom: 1px solid var(--border); }
.cat-nav-inner { max-width: 1280px; margin: 0 auto; padding: 0 24px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.cat-nav-inner::-webkit-scrollbar { display: none; }
.cat-btn { flex-shrink: 0; padding: 11px 16px; font-size: 13px; font-weight: 500; font-family: var(--font); color: var(--text2); background: none; border: none; border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
.cat-btn:hover { color: var(--g500); }
.cat-btn.active { color: var(--g700); border-bottom-color: var(--g700); font-weight: 700; }

/* Main / Grid */
.main { max-width: 1280px; margin: 0 auto; padding: 28px 24px 140px; }
.section-hd { font-size: 22px; font-weight: 800; color: var(--g900); margin-bottom: 20px; }
.section-hd em { font-style: normal; color: var(--g400); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
.card { background: var(--white); border-radius: var(--r); border: 1.5px solid var(--border); overflow: hidden; box-shadow: var(--shadow-sm); transition: box-shadow .2s, transform .2s; }
.card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.card-img { height: 136px; display: flex; align-items: center; justify-content: center; font-size: 54px; }
.ci-dairy         { background: linear-gradient(135deg,#EBF8FF,#BEE3F8); }
.ci-eggs          { background: linear-gradient(135deg,#FFFFF0,#FEFCBF); }
.ci-bakery        { background: linear-gradient(135deg,#FFFAF0,#FEEBC8); }
.ci-meat          { background: linear-gradient(135deg,#FFF5F5,#FED7D7); }
.ci-fruit         { background: linear-gradient(135deg,#FAF5FF,#E9D8FD); }
.ci-vegetables    { background: linear-gradient(135deg,#F0FFF4,#C6F6D5); }
.ci-confectionery { background: linear-gradient(135deg,#FFF0F3,#FED7E2); }
.ci-canned        { background: linear-gradient(135deg,#F7FAFC,#E2E8F0); }
.card-body { padding: 13px 14px; }
.card-cat { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; color: var(--g500); margin-bottom: 3px; }
.card-name { font-size: 13.5px; font-weight: 600; color: var(--text); line-height: 1.3; min-height: 34px; margin-bottom: 4px; }
.card-id { font-size: 11px; color: var(--text3); margin-bottom: 10px; }
.card-foot { display: flex; align-items: flex-end; justify-content: space-between; }
.card-price { font-size: 19px; font-weight: 800; color: var(--g700); line-height: 1; }
.card-unit { font-size: 11px; color: var(--text3); margin-top: 2px; }
.add-btn { width: 36px; height: 36px; background: var(--g700); color: white; border: none; border-radius: 9px; flex-shrink: 0; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s, transform .1s; font-family: var(--font); }
.add-btn:hover { background: var(--g900); transform: scale(1.08); }
.add-btn.in-cart { background: var(--g400); }

/* Cart drawer */
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.38); z-index: 300; opacity: 0; pointer-events: none; transition: opacity .25s; }
.backdrop.on { opacity: 1; pointer-events: all; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 390px; background: var(--white); z-index: 301; display: flex; flex-direction: column; box-shadow: var(--shadow-lg); transform: translateX(100%); transition: transform .3s cubic-bezier(.4,0,.2,1); }
.drawer.on { transform: none; }
.drawer-hdr { padding: 18px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.drawer-hdr h2 { font-size: 17px; font-weight: 700; }
.x-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: none; cursor: pointer; font-size: 18px; color: var(--text2); display: flex; align-items: center; justify-content: center; transition: background .15s; }
.x-btn:hover { background: var(--bg); }
.drawer-body { flex: 1; overflow-y: auto; padding: 16px 22px; }
.empty-state { text-align: center; padding: 56px 0; color: var(--text3); }
.empty-state .big { font-size: 52px; margin-bottom: 14px; }
.ci { display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--border); }
.ci-thumb { width: 50px; height: 50px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-sub { font-size: 11px; color: var(--text3); margin-top: 2px; }
.ci-qty { display: flex; align-items: center; gap: 7px; }
.qb { width: 26px; height: 26px; border-radius: 7px; border: 1.5px solid var(--border); background: none; cursor: pointer; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background .1s; }
.qb:hover { background: var(--bg); }
.ci-line { font-size: 13.5px; font-weight: 700; color: var(--g700); flex-shrink: 0; min-width: 44px; text-align: right; }
.drawer-foot { padding: 18px 22px; border-top: 1px solid var(--border); background: var(--bg); }
.total-row { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-bottom: 14px; }
.order-via-ai { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--g600), var(--g400)); color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: var(--font); transition: opacity .2s; box-shadow: 0 4px 14px rgba(38,103,73,.35); }
.order-via-ai:hover { opacity: .92; }

/* Chat FAB */
.fab { position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--g600), var(--g400)); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 28px; z-index: 200; box-shadow: 0 6px 24px rgba(38,103,73,.45); transition: transform .2s, box-shadow .2s; }
.fab:hover { transform: scale(1.08); box-shadow: 0 8px 30px rgba(38,103,73,.55); }

/* Chat panel */
.chat-panel { position: fixed; bottom: 100px; right: 28px; width: 400px; height: 550px; background: var(--white); border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 200; display: flex; flex-direction: column; opacity: 0; pointer-events: none; transform: translateY(16px) scale(.97); transition: opacity .25s, transform .25s; }
.chat-panel.on { opacity: 1; pointer-events: all; transform: none; }
.chat-hdr { padding: 14px 18px; background: linear-gradient(135deg, var(--g700), var(--g500)); border-radius: 20px 20px 0 0; display: flex; align-items: center; gap: 11px; color: white; }
.bot-av { width: 40px; height: 40px; border-radius: 50%; background: rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
.chat-hdr-info h3 { font-size: 14px; font-weight: 700; }
.chat-hdr-info p { font-size: 11.5px; opacity: .78; margin-top: 1px; }
.online-dot { width: 9px; height: 9px; background: #68D391; border-radius: 50%; margin-left: auto; flex-shrink: 0; box-shadow: 0 0 0 2px rgba(104,211,145,.3); }
.chat-x { background: rgba(255,255,255,.18); border: none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer; color: white; font-size: 15px; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.chat-x:hover { background: rgba(255,255,255,.3); }
.chat-msgs { flex: 1; overflow-y: auto; padding: 14px 14px 0; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.chat-msgs::-webkit-scrollbar { width: 4px; }
.chat-msgs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.msg { display: flex; gap: 8px; max-width: 90%; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.m-av { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.msg.bot  .m-av { background: var(--g100); }
.msg.user .m-av { background: var(--g700); color: white; font-weight: 700; font-size: 10px; }
.m-bub { padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.5; }
.msg.bot  .m-bub { background: var(--bg); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
.msg.user .m-bub { background: var(--g700); color: white; border-bottom-right-radius: 4px; }
.typing-bub { display: flex; gap: 5px; padding: 12px 14px; }
.dot { width: 7px; height: 7px; background: var(--text3); border-radius: 50%; animation: bob .8s infinite; }
.dot:nth-child(2) { animation-delay: .16s; }
.dot:nth-child(3) { animation-delay: .32s; }
@keyframes bob { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
.quick-row { padding: 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; border-top: 1px solid var(--border); }
.qchip { background: var(--g50); border: 1px solid var(--g100); color: var(--g700); border-radius: 50px; padding: 5px 11px; font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: var(--font); transition: background .15s; }
.qchip:hover { background: var(--g100); }
.chat-input-row { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
.chat-input { flex: 1; padding: 9px 14px; border: 1.5px solid var(--border); border-radius: 50px; font-size: 13.5px; font-family: var(--font); outline: none; background: var(--bg); transition: border-color .2s; }
.chat-input:focus { border-color: var(--g400); background: var(--white); }
.send-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--g700); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background .15s; }
.send-btn:hover { background: var(--g900); }
.send-btn svg { fill: white; }
.powered { font-size: 10.5px; color: var(--text3); text-align: center; padding: 4px 0 8px; }
.powered strong { color: var(--g500); }

/* Toast */
.toast { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%) translateY(12px); background: var(--g900); color: white; padding: 11px 20px; border-radius: 50px; font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .3s, transform .3s; z-index: 500; white-space: nowrap; }
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.no-results { grid-column: 1/-1; text-align: center; padding: 48px; color: var(--text3); font-size: 15px; }
</style>
</head>
<body>

<div class="promo-bar">
  <span>🚚 Free delivery on orders over £40</span>
  <span class="hi" id="promoCustomer">🏅 Emma Johnson — Gold Member · 4,320 pts</span>
  <span>⏱ Delivered in 2–4 hours</span>
</div>

<header class="header">
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">🛒</div>
      <div class="logo-name">Fresh<span>Mart</span></div>
    </a>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search products, brands…" oninput="render()">
    </div>
    <div class="hdr-actions">
      <div class="cust-chip" onclick="nextCustomer()" title="Click to switch customer">
        <div class="cust-avatar" id="custAv">EJ</div>
        <span id="custName">Emma J.</span>
        <span class="tier-badge t-gold" id="custTier">Gold</span>
      </div>
      <button class="cart-btn" onclick="openCart()">
        🛒 Basket
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<nav class="cat-nav">
  <div class="cat-nav-inner">
    <button class="cat-btn active" data-cat="all"           onclick="setCategory(this)">All Products</button>
    <button class="cat-btn"        data-cat="dairy"         onclick="setCategory(this)">🥛 Dairy</button>
    <button class="cat-btn"        data-cat="eggs"          onclick="setCategory(this)">🥚 Eggs</button>
    <button class="cat-btn"        data-cat="bakery"        onclick="setCategory(this)">🍞 Bakery</button>
    <button class="cat-btn"        data-cat="meat"          onclick="setCategory(this)">🥩 Meat</button>
    <button class="cat-btn"        data-cat="fruit"         onclick="setCategory(this)">🍇 Fruit</button>
    <button class="cat-btn"        data-cat="vegetables"    onclick="setCategory(this)">🥦 Vegetables</button>
    <button class="cat-btn"        data-cat="confectionery" onclick="setCategory(this)">🍫 Confectionery</button>
    <button class="cat-btn"        data-cat="canned"        onclick="setCategory(this)">🥫 Canned</button>
  </div>
</nav>

<main class="main">
  <h2 class="section-hd" id="sectionHd">Today's <em>Products</em></h2>
  <div class="grid" id="grid"></div>
</main>

<div class="backdrop" id="backdrop" onclick="closeCart()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-hdr">
    <h2>🛒 Your Basket</h2>
    <button class="x-btn" onclick="closeCart()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot" style="display:none">
    <div class="total-row"><span>Estimated Total</span><span id="cartTotal">£0.00</span></div>
    <button class="order-via-ai" onclick="sendCartToAgent()">✅ Place Order via AI Agent</button>
  </div>
</div>

<button class="fab" id="fab" onclick="toggleChat()" title="Chat with AI assistant">💬</button>

<div class="chat-panel" id="chatPanel">
  <div class="chat-hdr">
    <div class="bot-av">🤖</div>
    <div class="chat-hdr-info">
      <h3>FreshMart AI Assistant</h3>
      <p>Powered by WSO2 Agent Manager</p>
    </div>
    <div class="online-dot"></div>
    <button class="chat-x" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-msgs" id="chatMsgs"></div>
  <div class="quick-row">
    <button class="qchip" onclick="quickSend('What products do you have in stock?')">📦 Browse</button>
    <button class="qchip" onclick="quickSend('Show me my recent orders')">📋 My orders</button>
    <button class="qchip" onclick="quickSend('What are my loyalty points?')">⭐ My points</button>
    <button class="qchip" onclick="quickSend('Is PROD-001 in stock?')">📊 Stock check</button>
  </div>
  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="Ask me anything…" onkeydown="if(event.key==='Enter')sendMsg()">
    <button class="send-btn" onclick="sendMsg()">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
  <div class="powered">Powered by <strong>WSO2 Agent Manager</strong> · Gemini via AI Gateway</div>
</div>

<div class="toast" id="toast"></div>

<script>
const PRODUCTS = [
  { id:'PROD-001', name:'Morrisons British Whole Milk 4pt',       cat:'dairy',         price:1.65, unit:'bottle', e:'🥛' },
  { id:'PROD-002', name:'Morrisons Free Range Eggs 12pk',         cat:'eggs',          price:3.25, unit:'pack',   e:'🥚' },
  { id:'PROD-003', name:'Hovis Best of Both 800g',                cat:'bakery',        price:1.40, unit:'loaf',   e:'🍞' },
  { id:'PROD-004', name:'Lurpak Spreadable Butter 500g',          cat:'dairy',         price:3.75, unit:'tub',    e:'🧈' },
  { id:'PROD-005', name:'Morrisons Chicken Breast Fillets 600g',  cat:'meat',          price:4.50, unit:'pack',   e:'🍗' },
  { id:'PROD-006', name:'Morrisons Red Seedless Grapes 500g',     cat:'fruit',         price:2.00, unit:'bag',    e:'🍇' },
  { id:'PROD-007', name:'Cadbury Dairy Milk 200g',                cat:'confectionery', price:2.20, unit:'bar',    e:'🍫' },
  { id:'PROD-008', name:'Morrisons Broccoli 400g',                cat:'vegetables',    price:0.89, unit:'head',   e:'🥦' },
  { id:'PROD-009', name:'Heinz Baked Beans 415g',                 cat:'canned',        price:0.99, unit:'can',    e:'🥫' },
  { id:'PROD-010', name:'Morrisons Greek Style Yogurt 500g',      cat:'dairy',         price:1.85, unit:'pot',    e:'🍶' },
];
const CUSTOMERS = [
  { id:'CUST-5001', name:'Emma Johnson',    init:'EJ', tier:'Gold',   pts:4320, tc:'t-gold'   },
  { id:'CUST-5002', name:'Liam Thompson',   init:'LT', tier:'Silver', pts:1780, tc:'t-silver' },
  { id:'CUST-5003', name:'Sophie Williams', init:'SW', tier:'Bronze', pts:420,  tc:'t-bronze' },
];

const AGENT_BASE = 'http://localhost:8010';
const SESSION_ID = 'sess-' + Math.random().toString(36).slice(2, 10);
let custIdx = 0, activeCat = 'all', cart = {}, chatOpen = false;
const cust = () => CUSTOMERS[custIdx];

function nextCustomer() {
  custIdx = (custIdx + 1) % CUSTOMERS.length;
  const c = cust();
  document.getElementById('custAv').textContent = c.init;
  document.getElementById('custName').textContent = c.name.replace(/ (\w)\w+$/, ' $1.');
  const tb = document.getElementById('custTier');
  tb.textContent = c.tier; tb.className = 'tier-badge ' + c.tc;
  document.getElementById('promoCustomer').textContent = `🏅 ${c.name} — ${c.tier} Member · ${c.pts.toLocaleString()} pts`;
  toast(`Switched to ${c.name} (${c.tier})`);
  if (chatOpen) {
    document.getElementById('chatMsgs').innerHTML = '';
    addMsg('bot', `Hi ${c.name.split(' ')[0]}! 👋 Switched to your account. How can I help today?`);
  }
}

function setCategory(el) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active'); activeCat = el.dataset.cat;
  document.getElementById('sectionHd').innerHTML =
    activeCat === 'all' ? 'Today\'s <em>Products</em>' : `<em>${el.textContent.trim()}</em>`;
  render();
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const f = PRODUCTS.filter(p =>
    (activeCat === 'all' || p.cat === activeCat) &&
    (!q || p.name.toLowerCase().includes(q) || p.id.toLowerCase().includes(q))
  );
  const g = document.getElementById('grid');
  if (!f.length) { g.innerHTML = '<p class="no-results">No products found. Try a different search.</p>'; return; }
  g.innerHTML = f.map(p => {
    const qty = cart[p.id] || 0;
    return `<div class="card">
  <div class="card-img ci-${p.cat}">${p.e}</div>
  <div class="card-body">
    <div class="card-cat">${p.cat}</div>
    <div class="card-name">${p.name}</div>
    <div class="card-id">${p.id}</div>
    <div class="card-foot">
      <div><div class="card-price">£${p.price.toFixed(2)}</div><div class="card-unit">per ${p.unit}</div></div>
      <button class="add-btn ${qty?'in-cart':''}" onclick="addToCart('${p.id}',event)">${qty||'+'}</button>
    </div>
  </div>
</div>`;
  }).join('');
}

function addToCart(id, e) {
  e.stopPropagation(); cart[id] = (cart[id]||0)+1; render(); refreshBadge();
  toast(`${PRODUCTS.find(p=>p.id===id).e} Added to basket`);
}
function refreshBadge() {
  const n = Object.values(cart).reduce((a,b)=>a+b,0);
  const el = document.getElementById('cartCount');
  el.textContent = n; el.classList.toggle('on', n>0);
}
function openCart() { document.getElementById('backdrop').classList.add('on'); document.getElementById('drawer').classList.add('on'); renderCart(); }
function closeCart() { document.getElementById('backdrop').classList.remove('on'); document.getElementById('drawer').classList.remove('on'); }
function renderCart() {
  const entries = Object.entries(cart).filter(([,q])=>q>0);
  const body = document.getElementById('drawerBody'), foot = document.getElementById('drawerFoot');
  if (!entries.length) {
    body.innerHTML = `<div class="empty-state"><div class="big">🛒</div><p>Your basket is empty</p><p style="font-size:13px;margin-top:6px;color:#9CA3AF">Add items and order via AI</p></div>`;
    foot.style.display='none'; return;
  }
  foot.style.display=''; let total=0;
  body.innerHTML = entries.map(([id,qty]) => {
    const p=PRODUCTS.find(x=>x.id===id), line=p.price*qty; total+=line;
    return `<div class="ci">
  <div class="ci-thumb ci-${p.cat}">${p.e}</div>
  <div class="ci-info"><div class="ci-name">${p.name}</div><div class="ci-sub">${p.id} · £${p.price.toFixed(2)}/${p.unit}</div></div>
  <div class="ci-qty">
    <button class="qb" onclick="chQty('${id}',-1)">−</button>
    <span style="font-size:14px;font-weight:600;min-width:18px;text-align:center">${qty}</span>
    <button class="qb" onclick="chQty('${id}',1)">+</button>
  </div>
  <div class="ci-line">£${line.toFixed(2)}</div>
</div>`;
  }).join('');
  document.getElementById('cartTotal').textContent = '£'+total.toFixed(2);
}
function chQty(id,d) { cart[id]=Math.max(0,(cart[id]||0)+d); if(!cart[id])delete cart[id]; renderCart();render();refreshBadge(); }

async function sendCartToAgent() {
  const entries=Object.entries(cart).filter(([,q])=>q>0); if(!entries.length)return;
  const itemList=entries.map(([id,qty])=>{const p=PRODUCTS.find(x=>x.id===id);return `${qty}x ${p.name} (${id})`;}).join(', ');
  const msg=`Please place an order for customer ${cust().id}: ${itemList}`;
  closeCart(); if(!chatOpen)toggleChat(); addMsg('user',msg); await callAgent(msg); cart={}; render(); refreshBadge();
}

function toggleChat() {
  chatOpen=!chatOpen; document.getElementById('chatPanel').classList.toggle('on',chatOpen);
  document.getElementById('fab').textContent=chatOpen?'✕':'💬';
  if(chatOpen&&!document.getElementById('chatMsgs').children.length) {
    const c=cust();
    addMsg('bot',`Hi ${c.name.split(' ')[0]}! 👋 I'm your FreshMart AI assistant, connected to the WSO2 Agent Manager.\n\nI can help you:\n• Browse products & check stock\n• Place orders for delivery\n• Track existing orders\n• Review your loyalty account\n\nWhat can I do for you today?`);
  }
}
function addMsg(role,text) {
  const wrap=document.getElementById('chatMsgs'), c=cust(), el=document.createElement('div');
  el.className=`msg ${role}`;
  const safe=text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
  el.innerHTML=role==='bot'
    ?`<div class="m-av">🤖</div><div class="m-bub">${safe}</div>`
    :`<div class="m-av">${c.init}</div><div class="m-bub">${safe}</div>`;
  wrap.appendChild(el); wrap.scrollTop=wrap.scrollHeight;
}
function showTyping() {
  const wrap=document.getElementById('chatMsgs'), el=document.createElement('div');
  el.className='msg bot'; el.id='typing';
  el.innerHTML='<div class="m-av">🤖</div><div class="m-bub typing-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  wrap.appendChild(el); wrap.scrollTop=wrap.scrollHeight;
}
function hideTyping() { const e=document.getElementById('typing'); if(e)e.remove(); }

async function callAgent(message) {
  showTyping();
  try {
    const res=await fetch(AGENT_BASE + '/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,session_id:SESSION_ID,context:{customer_id:cust().id}})});
    hideTyping();
    if(res.status===500){
      addMsg('bot',"I'm sorry, I wasn't able to process that request. I'm a grocery shopping assistant — I can help you browse products, check stock, place orders, or track your deliveries. What can I help you with?");
      return;
    }
    if(!res.ok)throw new Error(`HTTP ${res.status} ${res.statusText}`);
    const data=await res.json();
    addMsg('bot',data.response||data.reply||JSON.stringify(data));
  } catch(err) {
    hideTyping();
    addMsg('bot',`⚠️ Could not reach the agent. Make sure the proxy is running:\npython3 proxy.py\n\nError: ${err.message}`);
  }
}
async function sendMsg() {
  const input=document.getElementById('chatInput'), msg=input.value.trim(); if(!msg)return;
  input.value=''; addMsg('user',msg); await callAgent(msg);
}
function quickSend(msg) { if(!chatOpen)toggleChat(); addMsg('user',msg); callAgent(msg); }

let toastT;
function toast(msg) {
  const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2600);
}

render();
</script>
</body>
</html>
